[package]
name = "casomira"
default-run = "casomira"
version = "0.1.0"
edition = "2024"
description = "Rust port of a swimming meet timing application"
authors = ["Časomíra"]
license = "MIT"

[dependencies]
eframe = { version = "0.33", default-features = true }
global-hotkey = "0.8"
serialport = "4.7"
rfd = "0.15"
encoding_rs = "0.8"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
libc = "0.2"
